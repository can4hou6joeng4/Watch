# 按改动路径给 PR 打标签（actions/labeler）。标签需事先存在于仓库。
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "**/*.md"
ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "**/package.json"
          - "**/package-lock.json"
          - "desktop/src-tauri/Cargo.*"
cli:
  - changed-files:
      - any-glob-to-any-file:
          - "src/**"
desktop:
  - changed-files:
      - any-glob-to-any-file:
          - "desktop/**"
site:
  - changed-files:
      - any-glob-to-any-file:
          - "site/**"
