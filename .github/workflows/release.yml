name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: 核对发布标签与源码版本
        if: github.ref_type == 'tag'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const tag = process.env.GITHUB_REF_NAME;
          for (const file of ['package.json', 'desktop/package.json', 'desktop/src-tauri/tauri.conf.json']) {
            const { version } = JSON.parse(readFileSync(file, 'utf8'));
            if (tag !== `v${version}`) {
              throw new Error(`发布标签 ${tag} 与 ${file} 的版本 ${version} 不一致`);
            }
          }
          NODE

      - name: 根依赖与类型检查
        run: |
          npm ci
          npm run typecheck

      - name: 前端依赖与构建
        run: |
          npm --prefix desktop ci
          npm --prefix desktop run build

      # 站点图标生成使用 desktop/node_modules 中的 React 与 Lucide。
      - name: 站点构建与分享图校验
        run: npm run site:build

      # cargo test 需要与打包相同的 Tauri Linux 运行时依赖
      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Rust 桥接测试
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml

  # macOS 两个目标放在**同一条 job** 里顺序构建（2026-11-19）：此前是两条矩阵腿，
  # macOS runner 队列紧张时第二条腿在 15 分钟内拿不到 runner 会被取消，`release` 随即
  # 被跳过（v0.1.192 连续两次，见 docs/evidence/iteration-274）。x64 本来就是 arm64
  # runner 上的交叉编译，合并后一次 release 只需取得一个 macOS runner。
  build-macos:
    needs: quality
    runs-on: macos-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # 仓库根依赖（app 运行期 resolve_cwd 要走 src/cli.ts + node_modules/tsx）
      - name: 根依赖
        run: npm ci

      - name: 桌面前端构建
        working-directory: desktop
        run: |
          npm ci
          npm run build

      - name: 打包（arm64）
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          args: --bundles dmg --target aarch64-apple-darwin

      # 静态检查 bundle 内 tsx/esbuild 的运行期依赖架构与 watch-core/package.json；不执行被打包的二进制。
      # Tauri 打完 DMG 会清理中间 Watch.app（0.1.25 首次运行即因此失败），因此只读挂载 DMG 再查包内资源。
      - name: 检查 arm64 运行期依赖
        run: |
          dmg=desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Watch_*.dmg
          mount=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mount" $dmg
          # 普通 detach 失败（卷忙）会把这个卷留在 /Volumes/Watch，下一次 dmg 打包
          # 用同名卷 create 时会报 hdiutil: create failed - Resource busy（0.1.280 / 0.1.281 连续两次）。
          # 这里先强制卸载；仍失败也不阻塞本步，由下面打包前的清理步骤兜底
          trap 'hdiutil detach "$mount" -force || true' EXIT
          app=$(find "$mount" -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$app"
          node scripts/verify-bundle-runtime.mjs "$app/Contents/Resources/watch-core" "darwin/arm64"

      # npm 按安装机架构选 @esbuild 可选包；交叉构建必须补装目标架构包，
      # 否则 watch-core 在目标机器上找不到可执行的 esbuild（0.1.25 修复）。
      - name: 交叉架构 esbuild 依赖（x64）
        run: |
          host=$(node -p 'process.arch')
          if [ "$host" != "x64" ]; then
            version=$(node -p "require('./node_modules/esbuild/package.json').version")
            npm install --no-save --force --ignore-scripts "@esbuild/darwin-x64@$version"
          fi

      # tauri 的 dmg 卷名取 productName（Watch），arm64 与 x86_64 同名。上一轮若把 arm64 卷
      # 留在 /Volumes/Watch，这一步 create 就会报 Resource busy——打包前显式清掉残留挂载。
      - name: 清理残留的 Watch DMG 挂载
        run: |
          for vol in /Volumes/Watch*; do
            [ -e "$vol" ] || continue
            echo "detaching $vol"
            hdiutil detach "$vol" -force || true
          done

      - name: 打包（x86_64 交叉编译）
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          args: --bundles dmg --target x86_64-apple-darwin

      - name: 检查 x64 运行期依赖
        run: |
          dmg=desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/Watch_*.dmg
          mount=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mount" $dmg
          trap 'hdiutil detach "$mount" -force || true' EXIT
          app=$(find "$mount" -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$app"
          node scripts/verify-bundle-runtime.mjs "$app/Contents/Resources/watch-core" "darwin/x64"

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: watch-macos
          path: |
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact: watch-windows-x64
          - os: ubuntu-latest
            bundles: deb
            artifact: watch-linux-amd64
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      # Tauri v2 在 Ubuntu 上的运行时/打包依赖
      - name: 系统依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # 仓库根依赖（app 运行期 resolve_cwd 要走 src/cli.ts + node_modules/tsx）
      - name: 根依赖
        run: npm ci

      - name: 桌面前端构建
        working-directory: desktop
        run: |
          npm ci
          npm run build

      # 只打包;release 由最后单独一个 job 统一建,避免矩阵并发创建互相冲突
      - name: 打包
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          args: --bundles ${{ matrix.bundles }}

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    concurrency:
      group: release-assets-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 创建 release 并上传安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${GITHUB_REF_NAME#v}
          expected=(
            "Watch_${version}_aarch64.dmg"
            "Watch_${version}_x64.dmg"
            "Watch_${version}_x64-setup.exe"
            "Watch_${version}_amd64.deb"
          )
          # 递归收集非空安装包。比较完整文件名可发现缺包、重复包和版本不符的包。
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find dist -type f -size +0c \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' \) -print0)
          if ! diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${files[@]##*/}" | sort); then
            echo "::error::安装包与 v${version} 的发布清单不一致"
            exit 1
          fi

          read_release() {
            gh release view "$GITHUB_REF_NAME" --json assets,isDraft
          }
          if ! release=$(read_release); then
            # 创建响应失败时重新读取，兼容服务端已创建草稿或同一标签已有发布页。
            if ! gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Watch $GITHUB_REF_NAME" --generate-notes; then
              echo '::notice::创建 Release 未成功返回，重新核对远端状态'
            fi
            release=$(read_release)
          fi

          classify_assets() {
            missing=()
            local file name local_digest remote_digest
            for file in "${files[@]}"; do
              name=${file##*/}
              remote_digest=$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | if .state == "uploaded" then .digest // "无摘要" else .state end' <<< "$release")
              if [[ -z "$remote_digest" ]]; then
                missing+=("$file")
                continue
              fi
              local_digest=$(sha256sum < "$file")
              if [[ "$remote_digest" != "sha256:${local_digest%% *}" ]]; then
                echo "::error::Release 上的 $name 缺少可核对的摘要或内容不同，请检查已有资产"
                exit 1
              fi
            done
          }
          classify_assets
          for file in "${missing[@]}"; do
            gh release upload "$GITHUB_REF_NAME" "$file"
          done

          release=$(read_release)
          classify_assets
          if (( ${#missing[@]} > 0 )); then
            echo '::error::Release 回读缺少安装包'
            exit 1
          fi
          if [[ $(jq -r '.isDraft' <<< "$release") == true ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false
          fi
