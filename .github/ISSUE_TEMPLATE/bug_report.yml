name: Bug 报告
description: 报告 Watch 的复现问题；请勿粘贴真实会话或凭据
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先用合成数据复现。不要粘贴真实聊天记录、工作目录、会话 ID、API key 或工具输出；必要路径请改成占位符。
  - type: input
    id: version
    attributes:
      label: Watch 版本
      description: 可用 `watch --version` 或安装包版本号
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node 版本
      description: CLI 需要 Node >= 22.13；请运行 node --version 后填写
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: 来源 → 目标 / 入口
      placeholder: 例如 Claude Code → Codex CLI，watch open --to
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 使用合成会话；写明实际执行的命令或点击路径
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果与实际结果
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 脱敏诊断
      description: 只贴必要的错误与 warnings，先移除路径、会话 ID、工具输出和凭据
    validations:
      required: false
